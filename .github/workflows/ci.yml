name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # shmop too: composer.json requires it (worker telemetry lives in
          # a shared-memory segment), and without it `composer install`
          # refuses the platform outright.
          extensions: pcntl, posix, shmop
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer test

      - run: composer analyse
